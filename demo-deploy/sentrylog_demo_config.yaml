  retention_days: 7
  cleanup_interval_hours: 6
  max_db_size_mb: 200

dashboard:
  host: 0.0.0.0
  port: 8514

alerting:
  email:
    enabled: false

netmon_integration:
  enabled: true
  netmon_url: "http://netmon-demo:8080"
