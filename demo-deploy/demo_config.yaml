# Enterprise demo license (all features unlocked)
license_key: "ENT-DEMO2026-1E5178571A318BFD"

# Demo user authentication
users:
  - username: demo
    password: TryNetMon2026
    role: admin

# Disable outbound notifications (demo safety)
webhooks: []

# Helpdesk integration (disabled for demo - shows UI only)
helpdesk:
  provider: ""
  sync_interval_minutes: 5
  auto_create_tickets: false
  freshservice:
    domain: ""
    api_key: ""
    default_requester_email: ""
  connectwise:
    site_url: ""
    company_id: ""
    public_key: ""
    private_key: ""
    client_id: ""
    default_board_id: ""

check_interval_seconds: 30

dashboard:
  host: 0.0.0.0
  port: 8080

# SMTP disabled for demo
smtp:
  smtp_host: ""
  smtp_port: 587
  use_tls: true
  username: ""
  password: ""
  from_addr: ""
  recipients: []
  cooldown_minutes: 15

