# MyClover.Tech Suite - Live Demo Stack (Traefik Edition)
# Usage: docker compose up -d
# NetMon Demo:    https://demo.myclover.tech     (demo / TryNetMon2026)
# SentryLog Demo: https://logs.demo.myclover.tech
#
# Traefik (already running on VPS) handles SSL + routing automatically.

services:
  netmon-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netmon-demo
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netmon-demo.rule=Host(`demo.myclover.tech`)"
      - "traefik.http.routers.netmon-demo.entrypoints=websecure"
      - "traefik.http.routers.netmon-demo.tls.certresolver=letsencrypt"
      - "traefik.http.services.netmon-demo.loadbalancer.server.port=8080"
    environment:
      - DEMO_MODE=true
      - DEMO_DB_PATH=/app/netmon.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  sentrylog-demo:
    build:
      context: .
      dockerfile: Dockerfile.sentrylog
    container_name: sentrylog-demo
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentrylog-demo.rule=Host(`logs.demo.myclover.tech`)"
      - "traefik.http.routers.sentrylog-demo.entrypoints=websecure"
      - "traefik.http.routers.sentrylog-demo.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentrylog-demo.loadbalancer.server.port=8514"
    environment:
      - DEMO_MODE=true
      - SENTRYLOG_DB_PATH=/app-sentrylog/sentrylog.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8514/"]
      interval: 30s
      timeout: 10s
      retries: 3
