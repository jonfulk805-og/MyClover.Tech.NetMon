# MyClover.Tech.NetMon - Docker Compose
# Quick Start: docker compose up -d
# Dashboard: http://localhost:8080
#
# Mount your own config.yaml to customize devices and settings:
#   volumes:
#     - ./my-config.yaml:/app/config.yaml

services:
  netmon:
    image: ghcr.io/jonfulk805-og/myclover-netmon:latest
    container_name: myclover-netmon
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - netmon-data:/app/data
      # Uncomment to use your own config:
      # - ./config.yaml:/app/config.yaml
    environment:
      - TZ=America/Los_Angeles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  netmon-data:
