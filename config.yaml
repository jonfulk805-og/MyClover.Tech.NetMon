# ============================================================
# Clover.tech.netmon v5 - Configuration
# ============================================================
# Edit this file to add devices, configure checks, set up
# email alerts, and tune monitoring settings.
# ============================================================

# License key (leave blank for Community/free tier)
# Purchase a key at myclover.tech to unlock Pro or Enterprise features.
# Format: PRO-XXXXXXXX-YYYYYYYY or ENT-XXXXXXXX-YYYYYYYY
license_key: ""

# User authentication (Enterprise only)
# Configure users for role-based access control.
# Roles: admin, operator, viewer
# Leave empty to disable auth.
users: []
#  - username: admin
#    password: changeme
#    role: admin
#  - username: operator
#    password: changeme
#    role: operator

# Multi-channel notification webhooks (Enterprise only)
# Supported types: slack, teams, pagerduty, generic
webhooks: []
#  - type: slack
#    url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
#  - type: teams
#    url: "https://outlook.office.com/webhook/YOUR/WEBHOOK/URL"
#  - type: pagerduty
#    url: ""
#    routing_key: "YOUR_ROUTING_KEY"
#  - type: generic
#    url: "https://your-endpoint.com/webhook"

# Helpdesk / PSA integration (Pro+)
# Supported providers: freshservice, connectwise
helpdesk:
  provider: ""
  sync_interval_minutes: 5
  auto_create_tickets: false
  freshservice:
    domain: ""
    api_key: ""
    default_requester_email: ""
  connectwise:
    site_url: ""
    company_id: ""
    public_key: ""
    private_key: ""
    client_id: ""
    default_board_id: ""

check_interval_seconds: 60

dashboard:
  host: 0.0.0.0
  port: 8080

smtp:
  smtp_host: ""
  smtp_port: 587
  use_tls: true
  username: ""
  password: ""
  from_addr: "netmon@yourdomain.com"
  recipients: []
  cooldown_minutes: 15

# AI Assistant (Enterprise only)
# Configure which AI provider Chappie uses.
# Providers: ollama (local/remote), openai (OpenAI-compatible), anthropic (Claude)
# Environment variables override these settings in Docker deployments.
ai_assistant:
  provider: "ollama"
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: "llama3.1:8b-instruct-q4_K_M"
  openai:
    base_url: "https://api.openai.com/v1"
    api_key: ""
    model: "gpt-4o-mini"
  anthropic:
    base_url: "https://api.anthropic.com"
    api_key: ""
    model: "claude-sonnet-4-20250514"

devices:
  - name: "Gateway Router"
    host: "192.168.1.1"
    group: "Network"
    parent: ""
    notes: "Main gateway router"
    maintenance: false
    links: []
    checks:
      - type: ping
        label: "ICMP"
        warning_ms: 20
        critical_ms: 100
        timeout_ms: 5000
        retries: 2

  - name: "Core Switch"
    host: "192.168.1.2"
    group: "Network"
    parent: "Gateway Router"
    notes: "Core switch - depends on Gateway Router"
    maintenance: false
    links: []
    checks:
      - type: ping
        label: "ICMP"
        warning_ms: 10
        critical_ms: 50

  - name: "Web Server"
    host: "192.168.1.10"
    group: "Servers"
    parent: "Core Switch"
    notes: ""
    maintenance: false
    links: []
    checks:
      - type: ping
        label: "ICMP"
      - type: http
        label: "HTTP"
        url: "http://192.168.1.10"
        expected_code: 200
        timeout_ms: 10000

  - name: "DNS Server"
    host: "192.168.1.5"
    group: "Servers"
    parent: "Core Switch"
    notes: ""
    maintenance: false
    links: []
    checks:
      - type: ping
        label: "ICMP"
      - type: port
        label: "DNS"
        port: 53

  - name: "Mail Server"
    host: "192.168.1.20"
    group: "Servers"
    parent: "Core Switch"
    notes: ""
    maintenance: false
    links: []
    checks:
      - type: ping
        label: "ICMP"
      - type: port
        label: "SMTP"
        port: 25

  - name: "Office AP"
    host: "192.168.1.100"
    group: "Wireless"
    parent: "Core Switch"
    notes: ""
    maintenance: false
    links: []
    checks:
      - type: ping
        label: "ICMP"
        warning_ms: 30
        critical_ms: 150
